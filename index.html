<html>
    <head>
        <script src="https://code.iconify.design/2/2.2.1/iconify.min.js"></script>
        
        <!-- Fonts & Icons -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="index.css">
    </head>
    <body class="contact-page">
        <main id="main">
            <!-- Form section -->
            <section class="contact-form-section">
                <form>
                    <h1 class="contact-form-heading">Reach <span>Out</span></h2>
                    <p class="contact-form-intro">Curious about something? Complete these fields and "get in touch", as you humans say. 🤙</p>
                    <label for="name">Full name</label>
                    <input class="contact-input" type="text" id="name" placeholder="Janne Pauwels" />
                    
                    <label for="email">Email</label>
                    <input class="contact-input" type="text" id="email" placeholder="jannepauwels@email.com" />
                    
                    <label for="message">Message...</label>
                    <textarea class="contact-textarea" id="message" rows="4" cols="50" placeholder="How do I stop my order from being stolen by horses?"></textarea>
                    <button class="contact-submit-button" type="button" onclick="submitForm()">Send Message</button>
                </form>
                <img class="contact-image" src="images/connect.jpg" alt="Human hand and robot hand reaching out to eachother."/>
            </section>
        </main>
    </body>
</html>
